<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecnobot</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Intro Cover -->
  <div id="intro-cover" class="intro-cover">
    <!-- Animated Light Orbs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="intro-title">Tecnobot</div>
    <div class="intro-subtitle">Asistente académico</div>
    <div class="intro-hint">Haz clic para comenzar</div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="brand">Tecnobot</span>
      </div>
      
      <div class="sidebar-content">
        <button id="new-doc-btn" class="btn-new-doc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Subir nuevo PDF
        </button>

        <div class="docs-section">
          <span class="docs-label">DOCUMENTOS RECIENTES</span>
          <div id="docs-list" class="docs-list">
            <!-- Lista generada por JS -->
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Vista A: Upload -->
      <section id="upload-view" class="view-section">
        <div class="upload-container">
          <h2 class="upload-title">Sube tu documento PDF</h2>
          <p class="upload-subtitle">Haz preguntas con IA al instante</p>
          
          <div id="drop-zone" class="drop-zone">
            <div class="upload-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <p class="drop-text">Arrastra tu PDF aquí o</p>
            
            <input type="file" id="file-input" accept="application/pdf" class="hidden-input">
            
            <button id="browse-btn" class="btn-upload">
              <span class="btn-progress-fill" id="upload-progress-fill"></span>
              <span class="btn-label" id="upload-btn-label">Explorar archivos</span>
            </button>
            
            <p class="file-hint">Máximo 15MB · PDF</p>
            <div id="upload-error" class="upload-error hidden"></div>
          </div>
        </div>
      </section>

      <!-- Vista B: Chat -->
      <section id="chat-view" class="view-section hidden">
        <!-- Topbar -->
        <header class="chat-topbar">
          <div class="active-doc-badge">
            <span class="doc-icon">📄</span>
            <span id="active-doc-name" class="doc-name">documento.pdf</span>
          </div>
          <button id="export-chat-btn" class="btn-outline-sm">Exportar chat</button>
        </header>

        <!-- Tabs -->
        <div class="chat-tabs">
          <button class="tab-btn active" data-tab="chat">💬 Chat</button>
          <button class="tab-btn" data-tab="summary">📋 Resumen</button>
        </div>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-messages">
          <!-- Mensajes inyectados por JS -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
          <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" class="chat-input" placeholder="Escribe una pregunta sobre el documento..." autocomplete="off">
            <button type="submit" id="send-btn" class="btn-send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- JS en orden de dependencia -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const introCover = document.getElementById('intro-cover');
      const sidebar = document.querySelector('.sidebar');
      const main = document.querySelector('.main');
      
      const startApp = () => {
        introCover.classList.add('hide');
        sidebar.classList.add('animate-in');
        main.classList.add('animate-in');
        introCover.removeEventListener('click', startApp);
        setTimeout(() => introCover.remove(), 500);
      };

      introCover.addEventListener('click', startApp);
    });
  </script>
  <script src="js/services/apiService.js"></script>
  <script src="js/models/documentModel.js"></script>
  <script src="js/models/chatModel.js"></script>
  <script src="js/controllers/uploadController.js"></script>
  <script src="js/controllers/chatController.js"></script>
</body>
</html>
