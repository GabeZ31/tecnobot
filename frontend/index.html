<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnobot - Chat con tus PDFs</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-content">
            <!-- Icono simplificado SVG -->
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h1>Tecnobot</h1>
        </div>
    </nav>

    <main>
        <!-- Sección de subida de PDF -->
        <section id="upload-section">
            <div class="upload-container">
                <h2>Sube tu documento PDF</h2>
                <p>Haz preguntas y extrae información al instante con IA.</p>
                
                <div id="drop-zone" class="upload-zone">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Arrastra y suelta tu archivo PDF aquí o</p>
                    <input type="file" id="file-input" accept="application/pdf" class="hidden-input">
                    <button id="browse-btn" class="btn btn--primary">Explorar archivos</button>
                    <p class="file-limits">Máximo 5MB</p>
                </div>

                <div id="upload-progress-container" class="hidden">
                    <div class="progress-bar-bg">
                        <div id="upload-progress" class="progress-bar"></div>
                    </div>
                </div>

                <div id="upload-status" class="status-msg hidden"></div>
            </div>
        </section>

        <!-- Sección de chat con el documento -->
        <section id="chat-section" class="hidden">
            <div class="chat-wrapper">
                <div class="chat-header">
                    <div class="doc-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span id="active-doc-name">documento.pdf</span>
                    </div>
                    <button id="new-doc-btn" class="btn btn--outline">Subir otro documento</button>
                </div>

                <div id="chat-container" class="chat-container">
                    <div class="message message--bot">
                        <div class="message-content">
                            ¡Hola! He procesado tu documento. ¿Qué te gustaría saber sobre él?
                        </div>
                    </div>
                </div>

                <div class="input-row">
                    <form id="chat-form" class="chat-form">
                        <input type="text" id="chat-input" placeholder="Escribe tu pregunta aquí..." autocomplete="off" required>
                        <button type="submit" id="send-btn" class="btn btn--primary btn--icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- JS -->
    <script src="js/services/apiService.js"></script>
    <script src="js/models/documentModel.js"></script>
    <script src="js/models/chatModel.js"></script>
    <script src="js/controllers/uploadController.js"></script>
    <script src="js/controllers/chatController.js"></script>
</body>
</html>
