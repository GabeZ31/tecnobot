<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecnobot</title>
  <link rel="stylesheet" href="css/main.css?v=2.1">
  <link rel="stylesheet" href="css/components.css?v=2.1">
</head>
<body>
  <!-- Intro Cover -->
  <div id="intro-cover" class="intro-cover">
    <!-- Animated Light Orbs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="intro-title">Tecnobot</div>
    <div class="intro-subtitle">Asistente académico</div>
    <div class="intro-hint">Haz clic para comenzar</div>
  </div>

  <div class="app">
    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="brand">Tecnobot</span>
        <button id="sidebar-close-btn" class="btn-sidebar-close" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="sidebar-content">
        <button id="new-doc-btn" class="btn-new-doc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Subir nuevo PDF
        </button>

        <div class="create-category-container">
          <input type="text" id="new-category-input" placeholder="Nueva materia..." maxlength="20">
          <button id="add-category-btn" class="btn-add-category" title="Crear materia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <div class="docs-section">
          <span class="docs-label">DOCUMENTOS POR MATERIA</span>
          <div id="docs-list" class="docs-list">
            <!-- Lista generada por JS -->
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Vista A: Upload -->
      <section id="upload-view" class="view-section">
        <button class="mobile-menu-btn upload-menu-btn" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="upload-container">
          <h2 class="upload-title">Sube tu documento PDF</h2>
          <p class="upload-subtitle">Haz preguntas con IA al instante</p>
          
          <div id="drop-zone" class="drop-zone">
            <div class="upload-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <p class="drop-text">Arrastra tu PDF aquí o</p>
            
            <input type="file" id="file-input" accept="application/pdf" class="hidden-input">
            
            <button id="browse-btn" class="btn-upload">
              <span class="btn-progress-fill" id="upload-progress-fill"></span>
              <span class="btn-label" id="upload-btn-label">Explorar archivos</span>
            </button>
            
            <p class="file-hint">Máximo 15MB · PDF</p>
            <div id="upload-error" class="upload-error hidden"></div>
          </div>
        </div>
      </section>

      <!-- Vista B: Chat -->
      <section id="chat-view" class="view-section hidden">
        <!-- Topbar -->
        <header class="chat-topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn chat-menu-btn" aria-label="Volver a documentos">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </button>
            <div class="active-doc-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="doc-icon">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span id="active-doc-name" class="doc-name">documento.pdf</span>
            </div>
          </div>
          <button id="export-chat-btn" class="btn-outline-sm hidden-mobile">Exportar chat</button>
        </header>

        <!-- Tabs -->
        <div class="chat-tabs">
          <button class="tab-btn active" data-tab="chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Chat
          </button>
          <button class="tab-btn" data-tab="summary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            Resumen
          </button>
          <button class="tab-btn" data-tab="study">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
            </svg>
            Estudiar
          </button>
        </div>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-messages">
          <!-- Mensajes inyectados por JS -->
        </div>

        <!-- Study Area -->
        <div id="study-messages" class="study-messages hidden">
          <!-- Cuestionario inyectado por JS -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
          <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" class="chat-input" placeholder="Escribe una pregunta sobre el documento..." autocomplete="off">
            <button type="submit" id="send-btn" class="btn-send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- JS en orden de dependencia -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const introCover = document.getElementById('intro-cover');
      const sidebar = document.querySelector('.sidebar');
      const main = document.querySelector('.main');
      
      const startApp = () => {
        introCover.classList.add('hide');
        sidebar.classList.add('animate-in');
        main.classList.add('animate-in');
        introCover.removeEventListener('click', startApp);
        setTimeout(() => introCover.remove(), 500);
      };

      introCover.addEventListener('click', startApp);
    });
  </script>
  <script src="js/services/apiService.js?v=2.1"></script>
  <script src="js/models/documentModel.js?v=2.1"></script>
  <script src="js/models/chatModel.js?v=2.1"></script>
  <script src="js/controllers/uploadController.js?v=2.1"></script>
  <script src="js/controllers/chatController.js?v=2.1"></script>
</body>
</html>
