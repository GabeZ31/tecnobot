<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecnobot</title>
  <link rel="stylesheet" href="css/main.css?v=3.7">
  <link rel="stylesheet" href="css/components.css?v=3.7">
</head>
<body>
  <!-- Intro Cover -->
  <div id="intro-cover" class="intro-cover">
    <!-- Animated Light Orbs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="intro-title">Tecnobot</div>
    <div class="intro-subtitle">Asistente académico</div>
    <div class="intro-hint">Haz clic para comenzar</div>
  </div>

  <dialog id="utility-modal" class="utility-modal">
    <div class="utility-modal-panel">
      <div class="utility-modal-header">
        <div class="utility-modal-title-wrap">
          <span id="utility-modal-dot" class="utility-modal-dot"></span>
          <h2 id="utility-modal-title">Utilidad</h2>
        </div>
        <button id="close-utility-modal" class="utility-modal-close" type="button" aria-label="Cerrar utilidad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="utility-modal-body" class="utility-modal-body"></div>
    </div>
  </dialog>

  <dialog id="category-modal" class="category-modal">
    <form id="category-form" class="category-modal-form">
      <div class="category-modal-header">
        <div>
          <span class="category-modal-label">Organizar documentos</span>
          <h2>Nueva materia</h2>
        </div>
        <button id="close-category-modal" class="category-modal-close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <label for="new-category-input">Nombre de la nueva materia</label>
      <input type="text" id="new-category-input" maxlength="20" placeholder="Ej. Cálculo, Historia, Programación" autocomplete="off">
      <p id="category-modal-error" class="category-modal-error" role="alert"></p>
      <div class="category-modal-actions">
        <button id="cancel-category-modal" class="category-modal-cancel" type="button">Cancelar</button>
        <button id="add-category-btn" class="category-modal-submit" type="submit">
          Crear materia
        </button>
      </div>
    </form>
  </dialog>

  <div class="app">
    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="brand">Tecnobot</span>
        <button id="sidebar-close-btn" class="btn-sidebar-close" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div class="sidebar-content">
        <button id="new-doc-btn" class="btn-new-doc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Subir nuevo PDF
        </button>

        <button id="open-category-modal" class="btn-create-category" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Nueva materia</span>
        </button>

        <div class="utilities-accordion">
          <button id="utilities-toggle" class="utilities-toggle" type="button" aria-expanded="false">
            <span class="utilities-toggle-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              Utilidades
            </span>
            <svg class="utilities-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="utilities-content" class="utilities-content">
            <div class="utilities-list">
              <button class="utility-link" type="button" data-utility="merge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7v8a2 2 0 0 0 2 2h6M8 7V5a2 2 0 0 1 2-2h4l4 4v8a2 2 0 0 1-2 2h-2M8 7H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2"></path></svg>
                <span>Unir PDFs</span>
              </button>
              <button class="utility-link" type="button" data-utility="images">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg>
                <span>Imágenes a PDF</span>
              </button>
              <button class="utility-link" type="button" data-utility="apa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>Citas APA 7</span>
              </button>
              <button class="utility-link" type="button" data-utility="diagrams">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle><path d="m10.5 6.5-4 10.5M13.5 6.5l4 10.5M7 19h10"></path></svg>
                <span>Mapas y diagramas</span>
              </button>
            </div>
          </div>
        </div>

        <div class="docs-section">
          <span class="docs-label">TUS DOCUMENTOS</span>
          <div id="docs-list" class="docs-list">
            <!-- Lista generada por JS -->
          </div>

        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Vista A: Upload -->
      <section id="upload-view" class="view-section">
        <button class="mobile-menu-btn upload-menu-btn" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="upload-container">
          <h2 class="upload-title">Sube tu documento PDF</h2>
          <p class="upload-subtitle">Haz preguntas con IA al instante</p>
          
          <div id="drop-zone" class="drop-zone">
            <div class="upload-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <p class="drop-text">Arrastra tu PDF aquí o</p>
            
            <input type="file" id="file-input" accept="application/pdf" class="hidden-input">
            
            <button id="browse-btn" class="btn-upload">
              <span class="btn-progress-fill" id="upload-progress-fill"></span>
              <span class="btn-label" id="upload-btn-label">Explorar archivos</span>
            </button>
            
            <p class="file-hint">Máximo 15MB · PDF</p>
            <div id="upload-error" class="upload-error hidden"></div>
          </div>
        </div>
      </section>

      <!-- Vista B: Chat -->
      <section id="chat-view" class="view-section hidden">
        <!-- Topbar -->
        <header class="chat-topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn chat-menu-btn" aria-label="Volver a documentos">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </button>
            <h1 id="chat-context-title" class="chat-context-title">Tecnobot</h1>
          </div>
          <div class="pdf-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="doc-icon">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span id="active-doc-name" class="doc-name">documento.pdf</span>
            <span class="ready-dot" aria-hidden="true"></span>
          </div>
          <button id="export-chat-btn" class="btn-outline-sm hidden-mobile">Exportar chat</button>
        </header>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-messages">
          <!-- Mensajes inyectados por JS -->
        </div>

        <div id="quick-prompts" class="quick-prompts" aria-label="Sugerencias rápidas"></div>

        <!-- Study Area -->
        <div id="study-messages" class="study-messages hidden">
          <!-- Cuestionario inyectado por JS -->
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
          <div id="chat-utility-panel" class="chat-utility-panel hidden" role="dialog" aria-label="Utilidades">
            <div class="chat-utility-header">
              <strong>Utilidades</strong>
              <button id="close-chat-utility-panel" type="button" aria-label="Cerrar utilidades">&times;</button>
            </div>
            <div class="chat-utility-grid">
              <button class="chat-utility-card" type="button" data-chat-action="summary">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"></path><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
                </span>
                <b>Resumen</b>
                <small>Lo esencial del PDF.</small>
              </button>
              <button class="chat-utility-card" type="button" data-chat-action="exam">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.3A2.6 2.6 0 1 1 12 12.5V14"></path><path d="M12 17.2h.01"></path></svg>
                </span>
                <b>Examen</b>
                <small>Practica sobre el PDF.</small>
              </button>
              <button class="chat-utility-card" type="button" data-chat-action="flashcards">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path></svg>
                </span>
                <b>Tarjetas de estudio</b>
                <small>Repasa concepto y definición.</small>
              </button>
              <button class="chat-utility-card" type="button" data-utility="merge">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7v8a2 2 0 0 0 2 2h6"></path><path d="M8 7V5a2 2 0 0 1 2-2h4l4 4v8a2 2 0 0 1-2 2h-2"></path></svg>
                </span>
                <b>Unir PDFs</b>
                <small>Combina varios documentos.</small>
              </button>
              <button class="chat-utility-card" type="button" data-utility="images">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg>
                </span>
                <b>Imágenes a PDF</b>
                <small>Convierte JPG o PNG.</small>
              </button>
              <button class="chat-utility-card" type="button" data-utility="apa">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </span>
                <b>Citas APA 7</b>
                <small>Crea referencias completas.</small>
              </button>
              <button class="chat-utility-card" type="button" data-utility="diagrams">
                <span class="chat-utility-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle><path d="m10.5 6.5-4 10.5M13.5 6.5l4 10.5M7 19h10"></path></svg>
                </span>
                <b>Diagramas</b>
                <small>Crea y descarga SVG.</small>
              </button>
            </div>
          </div>
          <form id="chat-form" class="chat-form">
            <button id="open-chat-utility-panel" class="chat-utility-toggle" type="button" aria-expanded="false" aria-controls="chat-utility-panel" aria-label="Abrir utilidades">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <input type="text" id="chat-input" class="chat-input" placeholder="Escribe una pregunta sobre el documento..." autocomplete="off">
            <button type="submit" id="send-btn" class="btn-send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- JS en orden de dependencia -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const introCover = document.getElementById('intro-cover');
      const sidebar = document.querySelector('.sidebar');
      const main = document.querySelector('.main');
      
      const startApp = () => {
        introCover.classList.add('hide');
        sidebar.classList.add('animate-in');
        main.classList.add('animate-in');
        introCover.removeEventListener('click', startApp);
        setTimeout(() => introCover.remove(), 500);
      };

      introCover.addEventListener('click', startApp);
    });
  </script>
  <script src="js/services/apiService.js?v=3.7"></script>
  <script src="js/services/utilityService.js?v=3.7"></script>
  <script src="js/models/documentModel.js?v=3.7"></script>
  <script src="js/models/chatModel.js?v=3.7"></script>
  <script src="js/models/studyModel.js?v=3.7"></script>
  <script src="js/services/promptService.js?v=3.7"></script>
  <script src="js/views/markdownRenderer.js?v=3.7"></script>
  <script src="js/views/chatView.js?v=3.7"></script>
  <script src="js/views/studyView.js?v=3.7"></script>
  <script src="js/views/uploadView.js?v=3.7"></script>
  <script src="js/views/sidebarView.js?v=3.7"></script>
  <script src="js/views/utilityView.js?v=3.7"></script>
  <script src="js/controllers/uploadController.js?v=3.7"></script>
  <script src="js/controllers/utilityController.js?v=3.7"></script>
  <script src="js/controllers/chatController.js?v=3.7"></script>
</body>
</html>
