AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tecnobot - PDF Q&A Application using AWS Serverless

Globals:
  Function:
    Runtime: python3.9
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref DocumentsTable
        BUCKET_NAME: !Ref PDFsBucket
        REGION: !Ref AWS::Region

Resources:

  # ─── S3: PDF Storage ───────────────────────────────────────────────────────
  PDFsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tecnobot-pdfs-gabez31
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000

  # ─── S3: Frontend Static Hosting ───────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tecnobot-frontend-gabez31
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ─── DynamoDB ──────────────────────────────────────────────────────────────
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TecnoBot-Documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: chunkIndex
          AttributeType: N
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
        - AttributeName: chunkIndex
          KeyType: RANGE

  # ─── API Gateway ───────────────────────────────────────────────────────────
  TecnobotApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # ─── Lambda: Upload ────────────────────────────────────────────────────────
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Upload
      CodeUri: upload/
      Handler: handler.lambda_handler
      Timeout: 60
      Policies:
        - S3FullAccessPolicy:
            BucketName: tecnobot-pdfs-gabez31
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /upload
            Method: POST

  # ─── Lambda: Ask ───────────────────────────────────────────────────────────
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Ask
      CodeUri: ask/
      Handler: handler.lambda_handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AskApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /ask
            Method: POST

  # ─── CloudFront ────────────────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !Select [1, !Split ['://', !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100

Outputs:
  ApiGatewayUrl:
    Description: URL del API Gateway
    Value: !Sub 'https://${TecnobotApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: TecnobotApiUrl

  CloudFrontUrl:
    Description: URL de CloudFront
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: TecnobotCloudFrontUrl

  PDFsBucketName:
    Description: Nombre del bucket de PDFs
    Value: !Ref PDFsBucket

  FrontendBucketName:
    Description: Nombre del bucket del frontend
    Value: !Ref FrontendBucket
