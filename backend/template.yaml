AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tecnobot - PDF Q&A Application using AWS Serverless

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref DocumentsTable
        BUCKET_NAME: !Ref PDFsBucket
        REGION: !Ref AWS::Region
  Api:
    Cors:
      AllowMethods: "'POST,OPTIONS,GET'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
      AllowOrigin: "'*'"

Resources:

  # ─── S3: PDF Storage ───────────────────────────────────────────────────────
  PDFsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000

  # ─── DynamoDB ──────────────────────────────────────────────────────────────
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TecnoBot-Documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: chunkIndex
          AttributeType: N
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
        - AttributeName: chunkIndex
          KeyType: RANGE

  # ─── API Gateway ───────────────────────────────────────────────────────────
  TecnobotApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  # ─── Lambda: Upload ────────────────────────────────────────────────────────
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Upload
      CodeUri: upload/
      Handler: handler.lambda_handler
      Timeout: 60
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref PDFsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /upload
            Method: POST

  # ─── Lambda: Ask ───────────────────────────────────────────────────────────
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Ask
      CodeUri: ask/
      Handler: handler.lambda_handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AskApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /ask
            Method: POST

Outputs:
  ApiGatewayUrl:
    Description: URL del API Gateway
    Value: !Sub 'https://${TecnobotApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: TecnobotApiUrl

  PDFsBucketName:
    Description: Nombre del bucket de PDFs
    Value: !Ref PDFsBucket
