AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tecnobot - PDF Q&A Application using AWS Serverless

Parameters:
  FrontendOrigin:
    Type: String
    Default: '*'
    Description: Dominio permitido para las llamadas del frontend

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref DocumentsTable
        BUCKET_NAME: !Ref PDFsBucket
        REGION: !Ref AWS::Region
        CORS_ORIGIN: !Ref FrontendOrigin
        MODEL_ID: amazon.nova-lite-v1:0
Resources:

  # ─── S3: PDF Storage ───────────────────────────────────────────────────────
  PDFsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldDocuments
            Status: Enabled
            ExpirationInDays: 90

  # ─── DynamoDB ──────────────────────────────────────────────────────────────
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TecnoBot-Documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: chunkIndex
          AttributeType: N
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
        - AttributeName: chunkIndex
          KeyType: RANGE

  # ─── API Gateway ───────────────────────────────────────────────────────────
  TecnobotApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Mode: merge
      DefinitionBody:
        openapi: 3.0.1
        x-amazon-apigateway-import-mode: merge
        info:
          title: Tecnobot API
          version: 1.0
        paths: {}
        x-amazon-apigateway-cors:
          allowMethods:
            - POST
            - OPTIONS
            - GET
          allowHeaders:
            - Content-Type
            - X-Amz-Date
            - Authorization
            - X-Api-Key
          allowOrigins:
            - !Ref FrontendOrigin

  # ─── Lambda: Upload ────────────────────────────────────────────────────────
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Upload
      CodeUri: upload/
      Handler: handler.lambda_handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${PDFsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /upload
            Method: POST

  # ─── Lambda: Ask ───────────────────────────────────────────────────────────
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TecnoBot-Ask
      CodeUri: ask/
      Handler: handler.lambda_handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt DocumentsTable.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        AskApi:
          Type: Api
          Properties:
            RestApiId: !Ref TecnobotApi
            Path: /ask
            Method: POST

Outputs:
  ApiGatewayUrl:
    Description: URL del API Gateway
    Value: !Sub 'https://${TecnobotApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: TecnobotApiUrl

  PDFsBucketName:
    Description: Nombre del bucket de PDFs
    Value: !Ref PDFsBucket
